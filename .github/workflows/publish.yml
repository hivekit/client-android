name: Publish to JitPack

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jitpack-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDK_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$SDK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] ||
             [[ "${SDK_TAG^^}" == *-SNAPSHOT ]]; then
            echo "::error::Use a release tag such as v0.1.1 or v0.1.1-rc.1."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the public JitPack release
        shell: bash
        run: |
          curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors --max-time 120 \
            --output "$RUNNER_TEMP/hivekit.pom" \
            "https://jitpack.io/com/github/hivekit/client-android/$SDK_TAG/client-android-$SDK_TAG.pom"
      - name: Install the published SDK in an independent Android app
        run: >
          bash gradlew -p verification/android-consumer "-PsdkVersion=$SDK_TAG"
          :app:assembleDebug :app:assembleRelease :app:lintDebug
          --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          script: bash gradlew -p verification/android-consumer "-PsdkVersion=$SDK_TAG" :app:connectedDebugAndroidTest --no-daemon
      - name: Published dependency
        shell: bash
        run: |
          echo '### JitPack release verified on Android API 23' >> "$GITHUB_STEP_SUMMARY"
          echo "\`implementation(\"com.github.hivekit:client-android:$SDK_TAG\")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[Build log](https://jitpack.io/com/github/hivekit/client-android/$SDK_TAG/build.log)" >> "$GITHUB_STEP_SUMMARY"
