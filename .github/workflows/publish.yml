name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching an existing vVERSION tag (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] ||
             [[ "${RELEASE_VERSION^^}" == *-SNAPSHOT ]]; then
            echo "::error::Use a non-SNAPSHOT version such as 0.1.0 or 0.1.0-rc.1."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and assemble the release
        run: bash gradlew :sdk:check :sdk:publishAllPublicationsToBuildRepository "-PreleaseVersion=$RELEASE_VERSION" --no-daemon
      - name: Sign and upload for Portal review
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release credential: $name"
              exit 1
            fi
          done
          bash gradlew :sdk:publishToMavenCentral -PcentralRelease=true "-PreleaseVersion=$RELEASE_VERSION" --no-daemon --no-configuration-cache
      - name: Release next step
        shell: bash
        run: |
          echo "Uploaded io.hivekit:client-android:$RELEASE_VERSION for validation." >> "$GITHUB_STEP_SUMMARY"
          echo "Review the deployment in [Central Portal](https://central.sonatype.com/publishing/deployments) and click Publish after validation succeeds." >> "$GITHUB_STEP_SUMMARY"
